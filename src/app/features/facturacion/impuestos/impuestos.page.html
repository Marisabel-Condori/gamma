<gm-encabezado
  titulo="Facturas de impuestos"
  tituloMovil="Impuestos"
  [rutanavegacion]="rutanavegacion"
/>

<form [formGroup]="formulario" (ngSubmit)="onEmitir()" novalidate>
  <gm-seccion titulo="Datos de la factura" columnas="1fr 1fr 3fr">
    <gm-lista-control
      etiqueta="Multicentro"
      placeholder="{{
        isLoadingMulticentros() ? 'Cargando los multicentros' : 'Selecciona un multicentro'
      }}"
      [opciones]="opcionesMulticentros()"
      [deshabilitado]="isLoadingMulticentros() || !opcionesMulticentros().length"
      formControlName="codigoSucursal"
      buscable
    />
    <gm-texto-control etiqueta="Código cliente *" placeholder="" formControlName="codigoCliente" />
    <gm-opciones-control
      titulo="Casos especiales *"
      [opciones]="tiposCasosEspeciales"
      formControlName="tipoCasoEspecial"
    />
  </gm-seccion>
  <gm-seccion titulo="" columnas="1fr 1fr 1fr 0.6fr 2fr">
    <gm-texto-control etiqueta="Razón social *" placeholder="" formControlName="razonSocial" />
    <gm-lista-control
      etiqueta="Tipo de documento"
      placeholder="{{
        isLoadingTiposDeDocumento()
          ? 'Cargando los tipos de documento'
          : 'Selecciona un tipo de documento'
      }}"
      [opciones]="opcionesTiposDeDocumento()"
      [deshabilitado]="isLoadingTiposDeDocumento() || !opcionesTiposDeDocumento().length"
      formControlName="codigoTipoDocumento"
      buscable
    />
    <gm-texto-control
      etiqueta="Número de documento *"
      placeholder=""
      formControlName="numeroDocumento"
    />
    <gm-texto-control
      etiqueta="Complemento"
      placeholder=""
      [maxlength]="2"
      formControlName="complemento"
    />
    <gm-opciones-control
      titulo="Autorizar el registro con NIT inválido? *"
      [opciones]="tiposNitInvalido"
      formControlName="tipoNitInvalido"
    />
  </gm-seccion>
  <gm-seccion titulo="" columnas="1fr 1fr 1fr">
    <gm-texto-control etiqueta="Periodo *" placeholder="" formControlName="periodo" />
    <gm-texto-control
      etiqueta="Correo electrónico"
      placeholder=""
      tipo="email"
      formControlName="correoElectronico" />
    <gm-texto-control
      etiqueta="Número celular"
      placeholder=""
      tipo="number"
      [mensajes]="mensajeDigitos"
      formControlName="numeroCelular"
  /></gm-seccion>
  <gm-seccion titulo="Detalle de productos" columnas="1fr 1fr 0.6fr 0.6fr 0.6fr 1fr">
    <gm-lista-control
      etiqueta="Producto"
      placeholder="{{
        isLoadingProductos() ? 'Cargando los productos' : 'Selecciona los productos'
      }}"
      [opciones]="opcionesProductos()"
      [deshabilitado]="isLoadingProductos() || !opcionesProductos().length"
      [formControl]="formularioProducto.controls.codigoProducto"
      buscable
    />
    <gm-lista-control
      etiqueta="Unidad de medida"
      placeholder="{{
        isLoadingUnidadesDeMedida()
          ? 'Cargando la unidad de medida'
          : 'Selecciona la unidad de medida'
      }}"
      [opciones]="opcionesUnidadesDeMedida()"
      [deshabilitado]="isLoadingUnidadesDeMedida() || !opcionesUnidadesDeMedida().length"
      [formControl]="formularioProducto.controls.codigoUnidadMedida"
      buscable
    />
    <gm-texto-control
      etiqueta="Cantidad *"
      placeholder=""
      tipo="number"
      [mensajes]="mensajeMayorACero"
      [formControl]="formularioProducto.controls.cantidad"
    />
    <gm-texto-control
      etiqueta="Precio unitario *"
      placeholder=""
      tipo="number"
      [mensajes]="mensajeMayorACero"
      [formControl]="formularioProducto.controls.precioUnitario"
    />
    <gm-texto-control
      etiqueta="Descuento"
      placeholder=""
      tipo="number"
      [mensajes]="mensajeMonto"
      [formControl]="formularioProducto.controls.descuento"
    />
    <div class="seccion-botones">
      <button gmBoton="primario" type="button" (click)="onAddProducto()" [etiqueta]="'Adicionar'">
        <gm-icono nombre="agregar" />
      </button>
    </div>
  </gm-seccion>
  @if (errorProducto()) {
    <p class="gm-error" role="alert">{{ errorProducto() }}</p>
  }
  <div style="height: 20px"></div>
  <gm-tabla
    [datos]="filasProductos()"
    [columnas]="columnas"
    clave="codigo"
    cabecera="clara"
    [compacta]="true"
    vacio="Seleccione un producto para continuar"
  >
    <ng-template gmCelda="acciones" let-producto>
      <button
        gmBoton="peligro"
        chico
        type="button"
        icono="eliminar"
        [attr.aria-label]="'Quitar producto ' + producto.codigo"
        (click)="onRemoveProducto(producto)"
      ></button>
    </ng-template>
  </gm-tabla>
  @if (intentoEmitir() && productos.invalid) {
    <p class="gm-error" role="alert">Adiciona al menos un producto al detalle.</p>
  }
  <gm-seccion titulo="Datos del pago" columnas="1fr 0.6fr 1fr 1.2fr 0fr 0.6fr 0.6fr 0.6fr 1fr">
    <gm-lista-control
      etiqueta="Tipo moneda"
      placeholder="{{
        isLoadingMoneda() ? 'Cargando los tipos de moneda' : 'Selecciona el tipo de moneda'
      }}"
      [opciones]="opcionesMonedas()"
      [deshabilitado]="isLoadingMoneda() || !opcionesMonedas().length"
      formControlName="codigoMoneda"
      buscable
    />
    <gm-texto-control
      etiqueta="Tipo cambio *"
      placeholder=""
      tipo="number"
      [mensajes]="mensajeMayorACero"
      formControlName="tipoCambio"
    />
    <gm-lista-control
      etiqueta="Método pago"
      placeholder="{{
        isLoadingMetodoPago() ? 'Cargando los métodos de pago' : 'Selecciona el método de pago'
      }}"
      [opciones]="opcionesMetodosPago()"
      [deshabilitado]="isLoadingMetodoPago() || !opcionesMetodosPago().length"
      formControlName="codigoMetodoPago"
      buscable
    />
    <gm-tarjeta-control etiqueta="Número tarjeta" formControlName="numeroTarjeta" />
    <div class="divisor" aria-hidden="true"></div>
    <gm-texto-control
      etiqueta="Subtotal *"
      placeholder=""
      tipo="number"
      [mensajes]="mensajeMonto"
      formControlName="subTotal"
    />
    <gm-texto-control
      etiqueta="Descuento"
      placeholder=""
      tipo="number"
      [mensajes]="mensajeMonto"
      formControlName="descuento"
    />
    <gm-texto-control
      etiqueta="Monto total *"
      placeholder=""
      tipo="number"
      [mensajes]="mensajeMonto"
      formControlName="montoTotal"
    />
    <div class="seccion-botones">
      <button gmBoton="primario" type="submit" [etiqueta]="'Emitir'">
        <gm-icono nombre="emitir" />
      </button>
    </div>
  </gm-seccion>
  @if (intentoEmitir() && formulario.invalid) {
    <p class="gm-error" role="alert">Revisa los campos marcados antes de emitir.</p>
  }
</form>
