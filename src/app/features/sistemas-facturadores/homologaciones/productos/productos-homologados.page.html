@if (sistema(); as sistema) {
  <gm-encabezado
    titulo="Productos y servicios homologados"
    tituloMovil="Homologaciones"
    volver="/sistemas-facturadores"
    [migas]="migas()"
    [etiqueta]="sistema.codigo"
    etiquetaTipo="chip"
  >
    <gm-buscar placeholder="Buscar por código, producto o actividad..." [(valor)]="query" />
    <button gmBoton="primario" type="button" icono="agregar" etiqueta="Nueva homologación" compacto (click)="abrir()"></button>
  </gm-encabezado>

  <gm-tabla
    [datos]="filtrados()"
    [columnas]="columnas"
    cabecera="clara"
    anchoMinimo="1080px"
    [porPagina]="10"
    [vacio]="vacio()"
  >
    <ng-template gmCelda="acciones" let-homologacion>
      <gm-acciones-fila que="homologación" (editar)="abrir(homologacion)" (eliminar)="eliminar(homologacion)" />
    </ng-template>
  </gm-tabla>
} @else {
  <gm-encabezado titulo="Sistema no encontrado" />
  <a gmBoton="neutro" icono="volver" etiqueta="Volver a sistemas facturadores" routerLink="/sistemas-facturadores"></a>
}

@if (editando() !== null) {
  <gm-modal
    [titulo]="editando() ? 'Editar homologación' : 'Nueva homologación'"
    [etiqueta]="'Sistema · ' + sistema()?.codigo"
    ancho="680px"
    (cerrar)="editando.set(null)"
  >
    <form (submit)="guardar($event)" novalidate>
      <gm-seccion titulo="ENTEL" columnas="1fr 2fr">
        <gm-texto etiqueta="Código" placeholder="Ingresa el código" [(valor)]="codigoEntel" />
        <gm-texto etiqueta="Producto o servicio" placeholder="Ingresa el nombre" [(valor)]="productoEntel" />
      </gm-seccion>

      <gm-seccion titulo="SIN">
        <gm-lista
          etiqueta="Actividad"
          placeholder="Selecciona una actividad"
          [opciones]="actividades"
          [valor]="actividad()"
          (valorChange)="elegirActividad($event)"
        />
        <gm-lista
          etiqueta="Producto o servicio"
          placeholder="Selecciona un producto o servicio"
          [opciones]="productosSin()"
          [deshabilitado]="!actividad()"
          [(valor)]="productoSin"
        />
      </gm-seccion>

      @if (error()) {
        <p class="gm-error">{{ error() }}</p>
      }
      <div class="gm-acciones">
        <button gmBoton="neutro" type="button" etiqueta="Cancelar" (click)="editando.set(null)"></button>
        <button gmBoton="primario" type="submit" etiqueta="Guardar"></button>
      </div>
    </form>
  </gm-modal>
}
