@if (sucursal()) {
  <gm-encabezado
    titulo="Puntos de venta SIN"
    tituloMovil="Puntos de venta"
    [volver]="volver()"
    [migas]="migas()"
    [etiqueta]="sistema()?.codigo"
    etiquetaTipo="chip"
  >
    <gm-buscar placeholder="Buscar por código, punto de venta o CUIS..." [(valor)]="query" />
    <button gmBoton="primario" type="button" icono="sincronizar" etiqueta="Sincronizar" compacto (click)="sincronizar()"></button>
  </gm-encabezado>

  <gm-tabla
    [datos]="filtrados()"
    [columnas]="columnas"
    cabecera="clara"
    anchoMinimo="1500px"
    [porPagina]="10"
    [vacio]="vacio()"
  >
    <ng-template gmCelda="acciones">
      <gm-acciones-fila que="punto de venta" (editar)="avisar('Edición')" (eliminar)="avisar('Eliminación')" />
    </ng-template>
  </gm-tabla>
} @else {
  <gm-encabezado titulo="Sucursal no encontrada" />
  <a gmBoton="neutro" icono="volver" etiqueta="Volver a multicentros" [routerLink]="volver()"></a>
}
