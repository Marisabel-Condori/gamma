@if (sucursal()) {
  <gm-encabezado
    titulo="Puntos de venta SIN"
    tituloMovil="Puntos de venta"
    [volver]="volver()"
    [migas]="migas()"
    [subtitulo]="subtitulo()"
    [etiqueta]="sistema()?.codigo"
    etiquetaTipo="chip"
  >
    <gm-buscar placeholder="Buscar por código, punto de venta o CUIS..." [(valor)]="query" />
    <button gmBoton="primario" type="button" icono="sincronizar" etiqueta="Sincronizar" compacto (click)="sincronizar()"></button>
  </gm-encabezado>

  <gm-tabla
    [datos]="filtrados()"
    [columnas]="columnas"
    cabecera="clara"
    anchoMinimo="1500px"
    [porPagina]="10"
    [vacio]="vacio()"
  >
    <ng-template gmCelda="reprocesarCuis" let-p let-movil="movil">
      <button
        gmBoton
        chico
        type="button"
        icono="sincronizar"
        aria-label="Reprocesar CUIS"
        [etiqueta]="movil ? 'Reprocesar CUIS' : undefined"
        (click)="abrirReproceso(p, 'CUIS')"
      ></button>
    </ng-template>
    <ng-template gmCelda="reprocesarCufd" let-p let-movil="movil">
      <button
        gmBoton
        chico
        type="button"
        icono="sincronizar"
        aria-label="Reprocesar CUFD"
        [etiqueta]="movil ? 'Reprocesar CUFD' : undefined"
        (click)="abrirReproceso(p, 'CUFD')"
      ></button>
    </ng-template>
    <ng-template gmCelda="acciones">
      <gm-acciones-fila que="punto de venta" (editar)="avisar('Edición')" (eliminar)="avisar('Eliminación')" />
    </ng-template>
  </gm-tabla>
} @else {
  <gm-encabezado titulo="Sucursal no encontrada" />
  <a gmBoton="neutro" icono="volver" etiqueta="Volver a sucursales" [routerLink]="volver()"></a>
}

@if (reproceso(); as r) {
  <gm-modal [titulo]="'Reproceso ' + r.codigo" ancho="760px" (cerrar)="reproceso.set(null)">
    <div class="gm-campos">
      <gm-buscar placeholder="Buscar sistema SIN, código, CUIS o CUFD..." [(valor)]="queryReproceso" />
      <gm-tabla [datos]="sistemasSin()" [columnas]="columnasReproceso()">
        <ng-template gmCelda="reprocesar">
          <button gmBoton type="button" icono="sincronizar" aria-label="Reprocesar CUIS" (click)="reprocesar()"></button>
        </ng-template>
      </gm-tabla>
    </div>
  </gm-modal>
}
